<!DOCTYPE html>
<html>
<head>
    <title>Media Server - Final Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
</head>
<body style="background: #111; color: white; text-align: center; padding-top: 50px;">
    <h1>Mutants.mp4 Live Stream</h1>
    <div id="player" style="width: 800px; height: 450px; margin: auto; border: 2px solid #333;"></div>
    <script>
        // We use the full localhost URL to bypass any local file confusion
        var player = new Clappr.Player({
            source: "http://localhost:8080/video/stream/index.m3u8",
            parentId: "#player",
            width: 800,
            height: 450,
            autoPlay: true,
            mute: true
        });
    </script>
</body>
</html>
